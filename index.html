<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download that Stuff</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<style>
:root{color-scheme:dark;--bg:#040b12;--glow:#0e2a3a;--sf:#0d1d2a;--sf2:#122839;--edge:#24404f;--ink:#e6f1f5;--mute:#8aa0ad;--ac:#2dd4bf;--acd:#0f766e;--acink:#03231f;--gold:#f5b03a;--bad:#ff8a80;--ok:#7bd8a4;--p:0%}
*{box-sizing:border-box}
html{background:#050b12;scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#091723 0%,#050b12 100%)}
#intro{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 62%,rgba(7,78,119,.3),transparent 48%),linear-gradient(180deg,#061423 0%,#04101d 58%,#020812 100%);transition:opacity .42s ease,visibility .42s ease}
#intro[hidden]{display:none}
#intro::before{content:"";position:absolute;z-index:0;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(195,232,255,.025) 0 1px,transparent 1px 4px),linear-gradient(112deg,transparent 32%,rgba(40,156,205,.055) 32.2%,transparent 32.7%,transparent 68%,rgba(47,164,207,.04) 68.2%,transparent 68.6%);background-size:100% 4px,200% 100%;animation:introCurrent 6s ease-in-out infinite alternate}
#intro::after{content:"";position:absolute;z-index:2;left:-15%;right:-15%;top:0;height:2px;pointer-events:none;background:linear-gradient(90deg,transparent,#58cfff,transparent);box-shadow:0 0 22px rgba(43,184,255,.65);animation:introSweep 1.8s ease-out both}
#intro.intro-out{opacity:0;visibility:hidden;pointer-events:none}
.intro-core{position:relative;z-index:3;width:min(88vw,720px);text-align:center;animation:introRise .8s cubic-bezier(.2,.75,.25,1) both}
.intro-kicker{display:block;margin-bottom:22px;color:#8acbe8;font-size:12px;font-weight:700}
.intro-name{font:400 64px/.98 "Archivo Black",Inter,sans-serif;color:#f2f7fb;animation:introReveal .9s .12s cubic-bezier(.2,.75,.25,1) both}
.intro-name span{color:#55c9f3}
.intro-rule{height:2px;width:min(360px,70vw);margin:24px auto 14px;background:linear-gradient(90deg,transparent,#58cfff,#187db7,transparent);transform:scaleX(0);transform-origin:center;animation:introRule 1.05s .35s cubic-bezier(.2,.75,.25,1) forwards}
.intro-status{color:#8aa0ad;font-size:11px;font-weight:700;animation:introStatus .5s .7s ease-out both}
.intro-status i{display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:#43caff;box-shadow:0 0 12px #43caff;animation:introPulse .7s ease-in-out infinite alternate}
.intro-copy{max-width:460px;margin:0 auto 18px;color:#a9bdc9;font-size:14px}
.intro-actions{display:flex;justify-content:center;gap:10px}
.intro-actions[hidden]{display:none}
.intro-action{border:1px solid #31556a;border-radius:8px;background:#0d1d2a;color:#e6f1f5;padding:9px 14px;font:600 13px Inter,system-ui,sans-serif}
.intro-action:hover{border-color:#55c9f3;color:#55c9f3}
.intro-action.primary{background:#55c9f3;color:#03231f;border-color:#55c9f3}
.intro-action.primary:hover{filter:brightness(1.08);color:#03231f}
@keyframes introSweep{from{transform:translateY(-10vh);opacity:0}15%,75%{opacity:1}to{transform:translateY(110vh);opacity:0}}
@keyframes introCurrent{from{background-position:0 0,0% 50%}to{background-position:0 0,100% 50%}}
@keyframes introRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes introReveal{from{opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(12px)}to{opacity:1;clip-path:inset(0);transform:none}}
@keyframes introRule{to{transform:scaleX(1)}}
@keyframes introStatus{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes introPulse{to{opacity:.35}}
@media(max-width:520px){.intro-name{font-size:40px}.intro-kicker{font-size:10px}.intro-actions{flex-direction:column;align-items:stretch;width:min(240px,80vw);margin:auto}}
@media(prefers-reduced-motion:reduce){#intro,#intro::before,#intro::after,.intro-core,.intro-kicker,.intro-rule,.intro-name,.intro-status,.intro-status i{animation:none;transition:none}}
main{max-width:760px;margin:0 auto;padding:36px 20px 80px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:26px}
h1{font:400 34px/1.05 "Archivo Black",Inter,sans-serif;margin:0;text-transform:uppercase;color:var(--ac);text-shadow:0 3px 0 var(--acd),0 0 22px rgba(45,212,191,.25)}
.tag{margin:8px 0 0;color:var(--gold);font-size:14px}
#health{font-size:12.5px;color:var(--mute);border:1px solid var(--edge);background:var(--sf);border-radius:99px;padding:5px 12px;white-space:nowrap;margin-top:6px}
.status{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#health i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px}
#health.up i{background:var(--ok)}#health.down i{background:var(--bad)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hero{display:flex;border:2px solid var(--edge);border-radius:14px;overflow:hidden;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 30%,var(--sf)) var(--p),var(--sf) var(--p));transition:background .35s cubic-bezier(.22,1,.36,1);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.hero:focus-within{border-color:var(--ac)}
.hero input{flex:1;min-width:0;background:transparent;border:0;padding:20px 18px;font-size:17px}
.hero input:focus-visible{outline:none}
.hero input::placeholder{color:var(--mute)}
.go{background:var(--ac);color:var(--acink);border:0;padding:0 26px;font:400 14px "Archivo Black",Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;box-shadow:inset 0 -4px 0 var(--acd)}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:active:not(:disabled){box-shadow:inset 0 -1px 0 var(--acd);padding-top:3px}
.go:disabled{opacity:.5;cursor:default}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0 18px}
.seg{display:flex;gap:2px;height:44px;padding:4px;border:1px solid var(--edge);border-radius:12px;background:rgba(13,29,42,.75)}
.seg button{background:transparent;border:0;border-radius:8px;padding:0 16px;color:var(--mute);font:600 15px/1 Inter,system-ui,sans-serif}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--acink);font-weight:700;box-shadow:0 2px 10px rgba(45,212,191,.25)}
select,.field{background:var(--sf);border:2px solid var(--edge);border-radius:10px;padding:6px 10px}
select:hover,.field:hover{border-color:#31556a}
.field:focus-visible{outline:none;border-color:var(--ac)}
label.chk{display:flex;gap:9px;align-items:center;color:var(--mute);cursor:pointer;user-select:none}
.opts>label.chk{margin-left:6px}
input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:20px;height:20px;margin:0;display:inline-grid;place-content:center;border:2px solid var(--edge);border-radius:6px;background:var(--sf);cursor:pointer;transition:background-color .15s,border-color .15s,box-shadow .15s}
input[type=checkbox]::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--acink);border-bottom:2.5px solid var(--acink);transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
input[type=checkbox]:hover:not(:disabled){border-color:var(--ac)}
input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac);box-shadow:0 0 10px rgba(45,212,191,.35)}
input[type=checkbox]:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
input[type=checkbox]:disabled{opacity:.4;cursor:default}
label.chk:has(input:checked){color:var(--ink)}
@media (prefers-reduced-motion:reduce){input[type=checkbox],input[type=checkbox]::after{transition:none}}
details{border:2px solid var(--edge);border-radius:12px;background:var(--sf);margin-bottom:26px}
summary{padding:10px 14px;cursor:pointer;color:var(--gold);font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"\25B8";display:inline-block;margin-right:8px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.set{padding:4px 14px 16px;display:grid;gap:12px}
.row{display:flex;gap:8px}.row .field{flex:1;min-width:0}
.set .lbl{font-size:13px;color:var(--mute);margin-bottom:4px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.btn{background:var(--sf2);border:2px solid var(--edge);border-radius:10px;padding:5px 11px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-block;line-height:1.5}
.btn:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-1px)}
.btn.bad{color:var(--bad)}.btn.bad:hover{border-color:var(--bad)}
#pl{display:none;border:2px solid var(--edge);border-radius:12px;background:var(--sf);margin-bottom:22px}
#pl.on{display:block}
#pl h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:2px solid var(--edge);display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--gold)}
#pl ul{list-style:none;margin:0;padding:6px 0;max-height:280px;overflow:auto}
#pl li{padding:5px 14px}
#pl li label{display:flex;gap:10px;cursor:pointer}
#pl .d{color:var(--mute);margin-left:auto;white-space:nowrap}
.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.it{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px;border:2px solid var(--edge);border-radius:12px;background:var(--sf)}
.th{width:96px;aspect-ratio:16/9;border-radius:8px;background:var(--sf2);object-fit:cover}
.tt-row{display:flex;align-items:center;gap:9px;min-width:0}.select-file{flex:none}
.tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta.err{color:var(--bad)}
.bar{height:6px;background:var(--sf2);border-radius:3px;margin:8px 0 2px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ac);width:0;transition:width .35s cubic-bezier(.22,1,.36,1)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{color:var(--mute);padding:24px 0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 10px}
.head h2{font-size:15px;margin:0;color:var(--gold)}
.head-actions{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:8px}
/* smooth menus */
.btn,.seg button,select,.field,.go,#health{transition:background-color .22s cubic-bezier(.22,1,.36,1),border-color .22s cubic-bezier(.22,1,.36,1),color .22s cubic-bezier(.22,1,.36,1),filter .22s cubic-bezier(.22,1,.36,1),box-shadow .22s cubic-bezier(.22,1,.36,1),opacity .22s cubic-bezier(.22,1,.36,1),transform .22s cubic-bezier(.22,1,.36,1)}
details.closing summary::before{transform:none}
#pl.on{animation:plIn .38s cubic-bezier(.16,1,.3,1);will-change:opacity,transform}
@keyframes plIn{from{opacity:0;transform:translateY(-10px) scale(.99)}to{opacity:1;transform:none}}
/* custom dropdown */
.dd{position:relative}.dd[hidden]{display:none}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:14px;height:44px;min-width:96px;background:rgba(13,29,42,.75);border:1px solid var(--edge);border-radius:12px;padding:0 16px 0 18px;font:600 15px/1 Inter,system-ui,sans-serif}
.dd-btn::after{content:"";width:6px;height:6px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-2px) rotate(45deg);transition:transform .2s,border-color .2s}
.dd-btn:hover{border-color:#31556a}
.dd.open .dd-btn{border-color:var(--ac)}
.dd.open .dd-btn::after{transform:translateY(2px) rotate(-135deg);border-color:var(--ac)}
.dd-menu{position:absolute;left:0;top:calc(100% + 6px);min-width:100%;z-index:20;margin:0;padding:5px;list-style:none;background:rgba(13,29,42,.96);backdrop-filter:blur(8px);border:2px solid var(--edge);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px rgba(45,212,191,.06);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-6px) scale(.97);transform-origin:top left;transition:opacity .15s,transform .15s,visibility 0s .15s}
.dd.open .dd-menu{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .15s,transform .2s cubic-bezier(.2,.8,.2,1),visibility 0s}
.dd-menu li{display:flex;align-items:center;justify-content:space-between;gap:18px;height:36px;padding:0 14px;font:600 15px/1 Inter,system-ui,sans-serif;border-radius:8px;cursor:pointer;color:var(--ink);white-space:nowrap;transition:background-color .12s,color .12s}
.dd-menu li.act{background:color-mix(in srgb,var(--ac) 16%,var(--sf2))}
.dd-menu li[aria-selected=true]{color:var(--ac);font-weight:700}
.dd-menu li:not([aria-selected=true]){color:var(--ink)}
.dd-menu li[aria-selected=true]::after{content:"\2713"}
@media (prefers-reduced-motion:reduce){.dd-menu,.dd-btn::after{transition:none}}
@media (max-width:520px){header{flex-wrap:wrap}h1{font-size:26px}.it{grid-template-columns:1fr}.th{width:100%}.go{padding:0 16px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero,summary::before,.bar b,.btn,.seg button,select,.field,.go,#health{transition:none}#pl.on{animation:none}.btn:hover{transform:none}}

[hidden]{display:none!important}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acink);font-weight:700}
.btn.pri:hover{filter:brightness(1.08);color:var(--acink)}
/* in-app player */
.wdlg{border:2px solid var(--edge);border-radius:14px;background:var(--sf);color:var(--ink);padding:0;width:min(960px,94vw);max-width:none;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.wdlg::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(3px)}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px 10px 16px}
.wtop .wt{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdlg video{display:block;width:100%;max-height:calc(92vh - 110px);background:#000;outline:none}
.wmsg{padding:10px 16px;font-size:13.5px;color:var(--bad)}
.wmsg:empty{display:none}
</style>
</head>
<body>
<div id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-kicker">
  <div class="intro-core"><span class="intro-kicker" id="intro-kicker">LOCAL MEDIA TOOL // READY</span><div class="intro-name">DOWNLOAD<br><span>THAT STUFF</span></div><div class="intro-rule"></div><p class="intro-copy" id="intro-copy" hidden></p><div class="intro-status"><i></i><span id="intro-status">DIVING IN</span></div><div class="intro-actions" id="intro-actions" hidden><button class="intro-action primary" id="intro-retry" type="button">Retry connection</button><button class="intro-action" id="intro-continue" type="button">Continue anyway</button></div></div>
</div>
<main inert>
<header><div><h1>Download that Stuff</h1></div><div class="status"><span id="health"><i></i><span>Checking backend</span></span></div></header>

<div id="pane-dl">
<form class="hero" id="f">
  <input id="url" type="url" placeholder="Paste a video or playlist link" autocomplete="off" required aria-label="Link">
  <button class="go" id="go" type="submit">Download</button>
</form>

<div class="opts">
  <div class="seg" id="type" role="group" aria-label="Download type">
    <button type="button" data-v="video_audio" aria-pressed="true">Video</button>
    <button type="button" data-v="audio_only" aria-pressed="false">Audio</button>
    <button type="button" data-v="video_only" aria-pressed="false">Video, no sound</button>
  </div>
  <select id="ext" aria-label="Format"></select>
  <select id="resolution" aria-label="Maximum resolution">
    <option value="best" selected>Best available</option>
    <option value="1440">Up to 1440p</option>
    <option value="1080">Up to 1080p</option><option value="720">Up to 720p</option>
    <option value="480">Up to 480p</option><option value="360">Up to 360p</option>
  </select>
  <select id="q" aria-label="Audio bitrate" hidden>
    <option value="128">128 kbps</option><option value="192" selected>192 kbps</option>
    <option value="256">256 kbps</option><option value="320">320 kbps</option>
    <option value="fast">Fast</option>
  </select>
  <label class="chk"><input type="checkbox" id="plist"> Playlist</label>
</div>

<details>
  <summary>Settings</summary>
  <div class="set">
    <div><div class="lbl">Save to</div>
      <div class="row"><input class="field" id="dir" placeholder="Default: the downloads folder next to server.js" aria-label="Download folder"><button type="button" class="btn" id="browse">Browse</button></div></div>
    <div><div class="lbl">Backend address</div><input class="field" id="backend" style="width:100%" placeholder="http://localhost:8000" aria-label="Backend address"></div>
    <div class="checks">
      <label class="chk"><input type="checkbox" id="organizeTypes"> Sort into Audio and Video folders</label>
      <label class="chk"><input type="checkbox" id="organizeChannel"> Sort into channel folders</label>
      <label class="chk"><input type="checkbox" id="extractSubtitles"> Save English subtitles</label>
      <label class="chk"><input type="checkbox" id="downloadMetadata"> Save description and info file</label>
      <label class="chk"><input type="checkbox" id="useCache"> Reuse files already downloaded</label>
      <label class="chk"><input type="checkbox" id="autoBrowser"> Also download in my browser when finished</label>
      <label class="chk"><input type="checkbox" id="replayIntroOnReload"> Replay intro on every page load</label>
    </div>
    <div><button type="button" class="btn" id="clr">Clear download cache</button> <span class="meta" id="clrmsg"></span></div>
  </div>
</details>

<section id="pl" aria-live="polite"></section>

<div class="head"><h2>Downloads</h2><div class="head-actions"><label class="chk" id="selectAllLabel" hidden><input type="checkbox" id="selectAll"> Select all</label><button class="btn bad" id="deleteSelected" type="button" hidden disabled>Delete selected</button><button class="btn" id="clrlist" type="button">Clear list</button></div></div>
<ul class="items" id="list"></ul>
<div class="empty" id="empty">Nothing on the line yet. Paste a link above to start.</div>
</div>

</main>

<dialog class="wdlg" id="wdlg" aria-label="Video player">
  <div class="wtop"><span class="wt" id="wt"></span><button type="button" class="btn" id="wclose">Close</button></div>
  <video id="wv" controls playsinline preload="metadata"></video>
  <div class="wmsg" id="wmsg" role="alert"></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
if('serviceWorker' in navigator){
  const workerUrl=new URL('./sw.js',location.href).href;
  navigator.serviceWorker.getRegistrations().then(registrations=>Promise.all(registrations.filter(registration=>[registration.active,registration.waiting,registration.installing].some(worker=>worker?.scriptURL===workerUrl)).map(registration=>registration.unregister()))).catch(()=>{});
}
if('caches' in window)caches.delete('download-that-stuff-shell-v1').catch(()=>{});
const intro=$('#intro'),app=$('main');
const replayIntroOnReload=(()=>{try{return JSON.parse(localStorage.getItem('dl.settings')||'{}').replayIntroOnReload===true}catch{return false}})();
let introTimer;
function finishIntro(){
  if(intro.hidden)return;
  clearTimeout(introTimer);intro.classList.add('intro-out');app.inert=false;
  try{sessionStorage.setItem('dl.intro.seen','1')}catch{}
  setTimeout(()=>{intro.hidden=true;$('#url').focus({preventScroll:true})},420);
}
function showOfflineIntro(){
  clearTimeout(introTimer);
  $('#intro-kicker').textContent='BACKEND OFFLINE';
  $('#intro-status').textContent='DOWNLOADER UNAVAILABLE';
  $('#intro-copy').textContent='The local downloader is offline. Your downloads and settings stay on this device.';
  $('#intro-copy').hidden=false;$('#intro-actions').hidden=false;
  intro.hidden=false;intro.classList.remove('intro-out');app.inert=true;
  $('#intro-retry').focus({preventScroll:true});
}
try{
  if(!replayIntroOnReload&&sessionStorage.getItem('dl.intro.seen')){intro.hidden=true;app.inert=false}
  else if(matchMedia('(prefers-reduced-motion:reduce)').matches){intro.hidden=true;app.inert=false}
  else introTimer=setTimeout(finishIntro,2200);
}catch{introTimer=setTimeout(finishIntro,2200)}
const HOSTED=/\.github\.io$/.test(location.hostname)||!location.protocol.startsWith('http');
let API=((()=>{try{return localStorage.getItem('dl.backend')}catch{}})()||(HOSTED?'http://localhost:8000':location.origin)).replace(/\/+$/,'');
const WSU=()=>API.replace(/^http/,'ws')+'/ws/download';
const EXTS={video_audio:['mp4','webm','mkv'],video_only:['mp4','webm','mkv'],audio_only:['mp3','m4a','ogg','opus','flac','wav']};
function setResolutionOptions(maxHeight=0){
  const select=$('#resolution'),previous=select.value;
  const options=[
    ['best','Best available'],
    ...(maxHeight>=4320?[['4320','Up to 8K (4320p)']]:[]),
    ...(maxHeight>=2160?[['2160','Up to 4K (2160p)']]:[]),
    ['1440','Up to 1440p'],['1080','Up to 1080p'],['720','Up to 720p'],['480','Up to 480p'],['360','Up to 360p']
  ];
  select.innerHTML=options.map(([value,label])=>`<option value="${value}">${label}</option>`).join('');
  if(options.some(([value])=>value===previous))select.value=previous;
}
let resolutionLookupTimer=null,resolutionLookupController=null;
function scheduleResolutionLookup(){
  clearTimeout(resolutionLookupTimer);resolutionLookupController?.abort();
  setResolutionOptions();
  const url=$('#url').value.trim();

/* ---------- 10-second audio preview ---------- */
const pv=new Audio();pv.preload='none';

const pvReset=()=>{pv.pause();pv.removeAttribute('src');pv.load()};
function stopPreview(){pvReset();if(pvId!==null){pvId=null;render()}}
async function togglePreview(it){
  if(pvId===it.id)return stopPreview();
  pvReset();pvId=it.id;pvErr=null;render();
  try{
    let url=it.file.preview;
    if(!url){ // files kept on disk: the server cuts the clip on request
      const r=await fetch(API+'/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filepath:it.file.url})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.detail||'Couldn\u2019t make a preview.');
      url=j.url;
    }

    pv.src=fileUrl(url);
    await pv.play();
  }catch(e){
    if(pvId!==it.id)return;
    pvId=null;pvErr={id:it.id,msg:e.name==='NotAllowedError'?'Your browser blocked playback. Click Preview again.':(e.message||'Preview isn\u2019t available for this file.')};render();
  }
}

// Playlists sent to the browser are held back and delivered as ONE .zip (a folder) once every item has finished.
function saveZip(g){
  const a=document.createElement('a');
  a.href=API+'/api/zip?group='+encodeURIComponent(g.id)+'&name='+encodeURIComponent(g.title);a.download='';
  document.body.appendChild(a);a.click();a.remove();
}
function checkGroup(g){
  if(!g||g.zipped)return;
  const mine=items.filter(i=>i.group&&i.group.id===g.id);
  if(mine.some(i=>i.status==='queued'||i.status==='active'))return; // still working
  const ready=mine.filter(i=>i.status==='done'&&i.deferred);
  if(!ready.length)return;
  g.zipped=true;ready.forEach(i=>i.deferred=false);saveZip(g);render();
}

/* ---------- queue ---------- */
function persist(){save('dl.history',items.filter(i=>i.status==='done').slice(0,30).map(({id,url,title,file,type,browserOnly}) => ({id,url,title,file,type,browserOnly})))}
function enqueue(url,group){
  items.unshift({id:Date.now()+Math.random(),url,title:url,status:'queued',pct:0,msg:'Waiting',type,group,
    ext:$('#ext').value,q:type==='audio_only'?$('#q').value:'best',resolution:type==='audio_only'?'best':$('#resolution').value});
  render();pump();
}
function pump(){
  while(running<PARALLEL){
    const it=[...items].reverse().find(i=>i.status==='queued');
    if(!it)return;
    running++;
    run(it).finally(()=>{running--;checkGroup(it.group);pump()}); // run() marks the item active immediately, so the next loop pass picks a different one
  }
}
function run(it){
  return new Promise(done=>{
    it.attempt=(it.attempt||0)+1;it.lastError='';it.status='active';it.msg=it.attempt>1?`Retrying download (${it.attempt-1}/${AUTO_RETRIES})`:'Connecting';render();
    const toBrowser=!!settings.autoBrowser; // fixed at start so the server and this page agree even if the box is toggled mid-download
    let ws;
    try{ws=new WebSocket(WSU())}catch{it.status='error';it.msg='Can\u2019t reach the backend.';render();return done()}
    it.ws=ws;
    ws.onopen=()=>ws.send(JSON.stringify({url:it.url,type:it.type,ext:it.ext,quality:it.q,resolution:it.resolution,allowPlaylist:false,group:it.group&&{id:it.group.id,title:it.group.title},settings:{...settings,autoBrowser:toBrowser}}));
    ws.onmessage=e=>{
      if(it.status!=='active')return;
      const m=JSON.parse(e.data);
      if(m.status==='completed'){it.file=m.file;it.title=m.file.title;it.status='done';it.pct=100;it.browserOnly=toBrowser;it.deferred=toBrowser&&!!it.group&&!it.group.zipped;persist();if(toBrowser&&!it.deferred)saveToDevice(it);render()}
      else if(m.status==='error'){it.lastError=m.msg;it.msg=m.msg;render()}
      else if(m.msg!==undefined&&m.status!=='connected'){if(typeof m.percent==='number')it.pct=m.percent;it.msg=m.msg;scheduleProgressRender()}
    };
    ws.onerror=()=>{if(it.status==='active'){it.lastError='Can\u2019t reach the backend.';ws.close()}};
    ws.onclose=()=>{
      it.ws=null;
      if(it.status==='active'){
        const permanent=/look like a link|Bad (download type|format options|resolution option)|yt-dlp .*installed/i.test(it.lastError||'');
        if(it.type!=='audio_only'&&!permanent&&it.attempt<=AUTO_RETRIES){
          it.status='retrying';it.msg=`Download failed. Retrying (${it.attempt}/${AUTO_RETRIES})...`;
          it.retryTimer=setTimeout(()=>{it.retryTimer=null;if(it.status==='retrying'){it.status='queued';render();pump()}},it.attempt*1000);
        }else{it.status='error';it.msg=it.lastError||'The connection closed before the download finished.'}
      }
      render();done();
    };
  });
}

/* ---------- render ---------- */
const canBulkDelete=i=>i.status==='done'&&i.file&&!i.browserOnly&&!i.missing&&!i.deferred;
function render(){
  const act=items.filter(i=>i.status==='active');
  $('#f').style.setProperty('--p',(act.length?act.reduce((t,i)=>t+i.pct,0)/act.length:0)+'%');
  $('#empty').style.display=items.length?'none':'block';
  const deletable=items.filter(canBulkDelete),selected=deletable.filter(i=>i.selected).length;
  $('#selectAllLabel').hidden=!deletable.length;
  $('#selectAll').checked=deletable.length>0&&selected===deletable.length;
  $('#selectAll').indeterminate=selected>0&&selected<deletable.length;
  $('#deleteSelected').hidden=!deletable.length;
  $('#deleteSelected').disabled=!selected;
  $('#deleteSelected').textContent=`Delete selected (${selected})`;
  $('#list').innerHTML=items.map(i=>{
    const thumb=i.file&&i.file.thumbnail?`<img class="th" src="${esc(i.file.thumbnail)}" alt="" loading="lazy">`:`<div class="th"></div>`;
    const selectBox=canBulkDelete(i)?`<input class="select-file" type="checkbox" data-select="${i.id}" aria-label="Select ${esc(i.title)}" ${i.selected?'checked':''}>`:'';
    let meta,acts='';
    if(i.status==='done'){
      meta=i.deferred?'Done. Will download as one .zip when the whole playlist finishes':i.browserOnly?'Sent to your browser':i.missing?'File was moved or deleted':esc((i.file.duration||'')+(i.type==='audio_only'?' \u00b7 audio':' \u00b7 video'));
      acts=i.deferred?'':(i.missing||i.browserOnly)?`<button class="btn" data-a="rm" data-id="${i.id}">Remove</button>`:
        `<button class="btn pri" data-a="watch" data-id="${i.id}">${i.type==='audio_only'?'Listen':'Watch'}</button>
         <button class="btn" data-a="save" data-id="${i.id}">Save to device</button>
         <a class="btn" href="${esc(fileUrl(i.file.url))}" target="_blank" rel="noopener">Open file</a>
         <button class="btn" data-a="show" data-id="${i.id}">Show in folder</button>
         <button class="btn bad" data-a="del" data-id="${i.id}">Delete file</button>`;
    }else if(i.status==='error'){
      meta=`<span class="meta err">${esc(i.msg)}</span>`;
      acts=`<button class="btn" data-a="retry" data-id="${i.id}">Try again</button><button class="btn" data-a="rm" data-id="${i.id}">Remove</button>`;
    }else if(i.status==='cancelled'){
      meta='Cancelled';acts=`<button class="btn" data-a="retry" data-id="${i.id}">Try again</button><button class="btn" data-a="rm" data-id="${i.id}">Remove</button>`;
    }else if(i.status==='retrying'){
      meta=esc(i.msg);acts=`<button class="btn bad" data-a="cancel" data-id="${i.id}">Cancel download</button>`;
    }else if(i.status==='queued'){
      meta='Waiting for earlier downloads';acts=`<button class="btn" data-a="rm" data-id="${i.id}">Cancel</button>`;
    }else {meta=esc(i.msg);acts=`<button class="btn bad" data-a="cancel" data-id="${i.id}">Cancel download</button>`}
    const bar=i.status==='active'?`<div class="bar"><b style="width:${i.pct}%"></b></div>`:'';
    return `<li class="it" data-id="${i.id}">${thumb}<div style="min-width:0"><div class="tt-row">${selectBox}<div class="tt" title="${esc(i.title)}">${esc(i.title)}</div></div>
      <div class="meta" data-status>${meta}</div>${pvErr&&pvErr.id===i.id?`<div class="meta err">${esc(pvErr.msg)}</div>`:''}${bar}<div class="acts">${acts}</div></div></li>`;
  }).join('');
}
$('#list').onchange=e=>{
  const checkbox=e.target.closest('input[data-select]');if(!checkbox)return;
  const it=items.find(i=>String(i.id)===checkbox.dataset.select);
  if(it)it.selected=checkbox.checked;

};
$('#selectAll').onchange=()=>{items.filter(canBulkDelete).forEach(i=>{i.selected=$('#selectAll').checked});render()};
$('#deleteSelected').onclick=async()=>{
  const selected=items.filter(i=>canBulkDelete(i)&&i.selected);
  if(!selected.length||!confirm(`Delete ${selected.length} selected files from disk?`))return;
  const failed=[];
  $('#deleteSelected').disabled=true;
  for(const it of selected){
    try{
      const result=await post('/api/delete_file',{filepath:it.file.url});
      if(result.status!=='ok')throw new Error(result.detail||'Delete failed');
      items=items.filter(item=>item!==it);
    }catch{failed.push(it)}
  }
  persist();render();
  if(failed.length)alert(`Could not delete ${failed.length} selected file${failed.length===1?'':'s'}.`);
};
$('#list').onclick=async e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const it=items.find(i=>String(i.id)===b.dataset.id);if(!it)return;
  const a=b.dataset.a;
  if(a==='rm'){items=items.filter(i=>i!==it);persist()}
  else if(a==='save')saveToDevice(it);
  else if(a==='watch'){openPlayer(it);return}
  else if(a==='preview'){togglePreview(it);return}
  else if(a==='retry'){it.attempt=0;it.lastError='';it.status='queued';it.pct=0;it.msg='Waiting';pump()}
  else if(a==='cancel'&&(it.status==='active'||it.status==='retrying')){it.status='cancelled';it.msg='Cancelled';clearTimeout(it.retryTimer);it.ws?.close()}
  else if(a==='show'){try{await post('/api/open_location',{filepath:it.file.url})}catch{}}
  else if(a==='del'){
    if(!confirm('Delete this file from disk?'))return;
    try{await post('/api/delete_file',{filepath:it.file.url});items=items.filter(i=>i!==it);persist()}catch{alert('Can\u2019t reach the backend.')}
  }
  render();
};
$('#clrlist').onclick=()=>{items=items.filter(i=>i.status==='active'||i.status==='queued'||i.status==='retrying');persist();render()};

function hidePl(){

  const h=box.offsetHeight;box.style.overflow='hidden';

async function showPlaylist(url){

  try{
    const r=await fetch(API+'/api/playlist_info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    const j=await r.json();

      <ul>${p.entries.map(e=>`<li><label><input type="checkbox" ${e.available?'checked':'disabled'} data-u="${esc(e.url||'')}"><span class="tt">${esc(e.title)}</span><span class="d">${esc(e.duration)}</span></label></li>`).join('')}</ul>`;
    const boxes=()=>[...box.querySelectorAll('input[data-u]:not(:disabled)')];
    $('#pall').onclick=()=>{const on=boxes().some(c=>!c.checked);boxes().forEach(c=>c.checked=on)};

  }catch(err){box.innerHTML=`<h2><span class="meta err">${esc(err.message)}</span><button class="btn" id="pclose" type="button">Close</button></h2>`;$('#pclose').onclick=()=>{hidePl()}}

/* ---------- custom dropdowns (replace the ugly native select popup) ---------- */
document.querySelectorAll('#ext,#q,#resolution').forEach(sel=>{
  sel.style.display='none';
  const dd=document.createElement('div');dd.className='dd';
  const btn=document.createElement('button');btn.type='button';btn.className='dd-btn';
  btn.setAttribute('aria-haspopup','listbox');btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label',sel.getAttribute('aria-label')||'');
  const menu=document.createElement('ul');menu.className='dd-menu';menu.setAttribute('role','listbox');
  dd.append(btn,menu);sel.after(dd);
  let act=0;
  const items=()=>[...menu.children];
  const sync=()=>{const o=sel.options[sel.selectedIndex];btn.textContent=o?o.textContent:'';items().forEach((li,i)=>li.setAttribute('aria-selected',i===sel.selectedIndex))};
  const setAct=i=>{act=i;items().forEach((li,k)=>li.classList.toggle('act',k===i))};
  const isOpen=()=>dd.classList.contains('open');
  const open=()=>{dd.classList.add('open');btn.setAttribute('aria-expanded','true');setAct(Math.max(0,sel.selectedIndex))};
  const close=()=>{dd.classList.remove('open');btn.setAttribute('aria-expanded','false')};
  const pick=i=>{sel.selectedIndex=i;sel.dispatchEvent(new Event('change'));sync();close();btn.focus()};
  const build=()=>{
    menu.innerHTML='';
    [...sel.options].forEach((o,i)=>{const li=document.createElement('li');li.setAttribute('role','option');li.textContent=o.textContent;li.onclick=()=>pick(i);li.onmouseenter=()=>setAct(i);menu.append(li)});
    sync();
  };
  btn.onclick=()=>isOpen()?close():open();
  btn.onkeydown=e=>{
    const n=sel.options.length;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!isOpen())open();else setAct((act+(e.key==='ArrowDown'?1:-1)+n)%n)}
    else if(isOpen()&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(act)}
    else if(e.key==='Escape'&&isOpen()){e.preventDefault();close()}
    else if(e.key==='Tab')close();
  };
  document.addEventListener('click',e=>{if(!dd.contains(e.target))close()});
  new MutationObserver(build).observe(sel,{childList:true});
  new MutationObserver(()=>{dd.hidden=sel.hidden;close()}).observe(sel,{attributes:true,attributeFilter:['hidden']});
  dd.hidden=sel.hidden;build();
});

</script>
</body>
</html>
